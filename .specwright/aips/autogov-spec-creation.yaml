plan:
- allowed_paths:
  - src/spec/autogov/**
  - tests/autogov/**
  description: Create autogov module with loader and centralized exceptions
  forbidden_paths:
  - src/spec/cli/**
  - src/spec/compiler/**
  - src/spec/executor/**
  - .git/**
  gate_ref: 'G0: Plan Approval'
  kind: code
  outputs:
  - src/spec/autogov/__init__.py
  - src/spec/autogov/loader.py
  - src/spec/autogov/exceptions.py
  - tests/autogov/__init__.py
  - tests/autogov/test_loader.py
  prompt: "Create the `src/spec/autogov/` module with:\n1. `__init__.py` - Minimal, NO autogov imports\
    \ at top level\n   - Only export exception classes and lazy loader\n   - This keeps `spec list`, `spec\
    \ validate` etc working if autogov env is broken\n2. `exceptions.py` - Centralized exit-code handling:\n\
    \   ```python\n   class SpecwrightError(Exception):\n       \"\"\"Base exception with exit code for\
    \ centralized CLI handling.\"\"\"\n       exit_code: int = 1\n       def __init__(self, message: str,\
    \ exit_code: int | None = None):\n           super().__init__(message)\n           if exit_code is\
    \ not None:\n               self.exit_code = exit_code\n   class AutogovNotInstalledError(SpecwrightError):\n\
    \       exit_code = 1\n   class GovernanceNotFoundError(SpecwrightError):\n       exit_code = 2\n\
    \   class GovernanceInvalidError(SpecwrightError):\n       exit_code = 3\n   class RegistryConfigError(SpecwrightError):\n\
    \       exit_code = 4\n   class CLIUsageError(SpecwrightError):\n       exit_code = 5\n   ```\n3.\
    \ `loader.py` - GovernanceLoader class with LAZY imports + TYPE_CHECKING:\n   ```python\n   from typing\
    \ import TYPE_CHECKING\n   if TYPE_CHECKING:\n       from autogov.models import PolicyPack, ArchPack,\
    \ StatePack\n   class GovernanceLoader:\n       def load_policy(self, project: str, source: str) ->\
    \ \"PolicyPack\":\n           try:\n               from autogov import load_artifact\n           except\
    \ ImportError:\n               raise AutogovNotInstalledError(\n                   \"This repo is\
    \ configured to use autogov, but autogov failed to load. \"\n                   \"Install or fix the\
    \ environment.\"\n               )\n           # ... load logic\n   ```\n   - `load_policy(project,\
    \ source) -> PolicyPack` (raises if missing)\n   - `load_arch(project, source) -> ArchPack` (raises\
    \ if missing)\n   - `load_state(project, source) -> StatePack | None` (warns if missing)\n   - `load_all(project,\
    \ source) -> GovernanceBundle`\n   - Use autogov types directly - no wrapper types\nWrite tests in\
    \ `tests/autogov/test_loader.py`:\n- Test successful load of each artifact type\n- Test missing policy\
    \ raises GovernanceNotFoundError (exit_code=2)\n- Test missing arch raises GovernanceNotFoundError\
    \ (exit_code=2)\n- Test missing state returns None with warning\n- Test missing autogov package raises\
    \ AutogovNotInstalledError (exit_code=1)"
  role: coding_agent
  step_id: step-001
  verification_commands:
  - ruff check src/spec/autogov/
  - mypy src/spec/autogov/
  - pytest tests/autogov/test_loader.py -v
