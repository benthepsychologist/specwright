  - tests/autogov/fixtures/sample_policy.yaml
  - tests/autogov/fixtures/sample_arch.yaml
  prompt: "Create `src/spec/autogov/context_builder.py` with SpecContextBuilder class:\n1. `build_forbidden_paths(policy:\
    \ PolicyPack) -> list[dict]`\n   - Extract paths from `policy.constraints.deny.paths`\n   - Return\
    \ list of `{\"path\": str, \"reason\": str}` dicts\n   - Format as glob patterns (append `/**` if\
    \ needed)\n2. `build_governance_context(bundle: GovernanceBundle, project: str, source: str) -> dict`\n\
    \   - Return dict with all template variables:\n     - `autogov` dict: `{\"project\": str, \"source\"\
    : str, \"captured_at\": ISO timestamp}`\n     - `autogov_policy_name`, `autogov_policy_version`\n\
    \     - `autogov_arch_name`, `autogov_arch_version`\n     - `autogov_arch_decisions` (list of decision\
    \ dicts)\n     - `autogov_policy_rules` (list of rule dicts, severity=error only)\n     - `autogov_forbidden_paths`\
    \ (from build_forbidden_paths)\n3. `build_prompt_header(policy: PolicyPack) -> str`\n   - Return deterministic\
    \ header for agent prompt:\n     ```\n     === GOVERNANCE (AUTOGOV) ===\n     Policy: {name} v{version}\n\
    \     ```\n4. `merge_with_template_context(bundle: GovernanceBundle, base_context: dict, project:\
