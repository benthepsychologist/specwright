plan:
- description: Prompt Resolver
  kind: code
  prompt: 'Create `src/spec/checks/resolver.py` for resolving check prompts.

    Define `PromptNotFoundError(SpecwrightError)` with exit_code = 2.

    Implement:

    - `resolve_prompt(prompt_ref: str, epic_path: Path) -> str`: Read prompt file from `<epic_path>/<prompt_ref>`.
    Return markdown content. Raise PromptNotFoundError if file doesn''t exist with clear error message
    including the path.'
  role: coding_agent
  step_id: step-001
- description: Input Gathering
  kind: code
  prompt: "Create `src/spec/checks/inputs.py` for gathering check inputs.\nDefine `InputGatherError(SpecwrightError)`\
    \ with exit_code = 1.\nDefine dataclass:\n```python\n@dataclass\nclass GatheredInput:\n    type: str\
    \       # epic, spec, file, git_diff, cli_output, governance_pack\n    source: str     # path, command,\
    \ or description\n    content: str    # the actual content\n```\nImplement:\n- `gather_inputs(check:\
    \ Check, epic: Epic, epic_path: Path) -> list[GatheredInput]`: Gather all inputs defined for a check.\
    \ Iterate through check.inputs and call _gather_single for each.\n- `_gather_single(input_def: CheckInput,\
    \ epic: Epic, epic_path: Path) -> GatheredInput`: Dispatch based on input_def.type.\nSupport these\
    \ input types:\n- `type: epic` → Read epic.yaml from epic_path\n- `type: spec` → Read spec file from\
    \ governor (path relative to governor root)\n- `type: file` → Read file from target repo (resolve\
    \ target from input_def.target or first target)\n- `type: git_diff` → Run `git diff <range>` in target\
    \ repo, capture output\n- `type: cli_output` → Execute command using args-based invocation (see below)\n\
    - `type: governance_pack` → Load governance context (see precedence rules below)\nFor git_diff, use\
    \ subprocess.run with cwd set to target.repo_path. Default range to \"HEAD~1..HEAD\" if not specified.\n\
    For cli_output:\n- Build argv as `[epic.run_context.cli_bin] + input_def.args`\n- Set cwd based on\
    \ `epic.run_context.cwd_policy`: governor → governor_root, repo → target.repo_path\n- Use `subprocess.run(argv,\
    \ shell=False, capture_output=True, timeout=30)`\n- Never use shell=True unless input_def.tool ==\
    \ \"shell\" (escape hatch, not recommended)\nFor governance_pack precedence:\n- If input_def.include\
    \ is set → use it\n- Else if epic.governance.include is set → use that\n- Else → include all available\
    \ (policy, arch, patterns)\nRaise InputGatherError on failures with descriptive message."
  role: coding_agent
  step_id: step-002
- description: Report Writer
  kind: code
  prompt: "Create `src/spec/llm/reporter.py` for writing check reports.\nDefine dataclass:\n```python\n\
    @dataclass\nclass CheckReport:\n    check_id: str\n    epic_id: str\n    spec_id: str | None\n   \
    \ model: str                # llm model alias used (or \"stub\" if no LLM)\n    timestamp: datetime\n\
    \    inputs: list[str]         # list of input source descriptions\n    verdict: str             \
    \ # PASS, WARN, FAIL, ERROR, NOT_RUN\n    content: str              # markdown body\n```\nImplement:\n\
    - `write_report(report: CheckReport, epic_path: Path) -> Path`: Write report to `reports/` directory.\
    \ Filename format: `YYYYMMDD-HHMM-<check_id>.md`. Include YAML frontmatter with check_id, epic_id,\
    \ spec_id (if present), model, timestamp, inputs, verdict. Return path to written report.\n- `parse_verdict(response:\
    \ str, is_stub: bool = False) -> str`: Parse verdict from LLM response. Look for line starting with\
    \ \"VERDICT:\". Accept PASS, WARN, FAIL, ERROR, NOT_RUN. If not found and is_stub=True, return NOT_RUN.\
    \ If not found and is_stub=False (real LLM response), return ERROR (malformed output is an error,\
    \ not a warning).\nReport format:\n```markdown\n---\ncheck_id: CHECK-xxx\nepic_id: e001-epic-system\n\
    spec_id: e001-01-epic-core  # if applicable\nmodel: gpt-4o\ntimestamp: 2025-12-26T14:30:00Z\ninputs:\n\
    \  - epic.yaml\n  - projects/specwright/specs/spec.md\nverdict: WARN\n---\n<markdown body from response>\n\
    ```"
  role: coding_agent
  step_id: step-003
- description: Stub Executor
  kind: code
  prompt: "Create `src/spec/checks/executor.py` for executing checks.\nImplement `CheckExecutor` class:\n\
    ```python\nclass CheckExecutor:\n    def __init__(self, llm_client=None):\n        \"\"\"\n      \
    \  Initialize executor.\n        llm_client: Optional LLM client. If None, uses stub.\n        \"\"\
    \"\n        self.llm_client = llm_client\n    def execute(\n        self,\n        epic: Epic,\n \
    \       check_id: str,\n        epic_path: Path,\n        spec_id: str | None = None,\n    ) -> CheckReport:\n\
    \        \"\"\"\n        Execute a check and return report (does not save).\n        1. Find check\
    \ by ID (raise ValueError if not found)\n        2. Resolve prompt from prompt_ref\n        3. Gather\
    \ inputs\n        4. Assemble full prompt (template + inputs)\n        5. Call LLM (or stub if no\
    \ client)\n        6. Parse verdict from response\n        7. Return CheckReport\n        \"\"\"\n\
    \        ...\n    def run_and_save(\n        self,\n        epic: Epic,\n        check_id: str,\n\
    \        epic_path: Path,\n        spec_id: str | None = None,\n    ) -> tuple[CheckReport, Path]:\n\
    \        \"\"\"\n        Execute check, write report, update history.\n        Returns (report, report_path).\n\
    \        \"\"\"\n        ...\n    def _assemble_prompt(self, template: str, inputs: list[GatheredInput])\
    \ -> str:\n        \"\"\"Assemble full prompt with inputs section.\"\"\"\n        # Add inputs under\
    \ \"# Inputs\" header with type and source\n        ...\n    def _stub_response(self, check: Check)\
    \ -> str:\n        \"\"\"Generate stub response when no LLM client.\"\"\"\n        # Return formatted\
    \ response with VERDICT: NOT_RUN\n        ...\n```\nWhen no LLM client is provided, `_stub_response`\
    \ should return:\n```\nVERDICT: NOT_RUN\nSUMMARY: LLM integration not configured\n# Check Report:\
    \ {check.name}"
  role: coding_agent
  step_id: step-004
