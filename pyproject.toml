[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specwright"
version = "0.6.0"
description = "The architect of agentic workflows. Defines, validates, and executes AIPs."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Benjamin Armstrong", email = "ben@benthepsychologist.com"}
]
requires-python = ">=3.14"
keywords = [
    "agentic",
    "orchestration",
    "governance",
    "agentsway",
    "implementation-plans",
    "specwright",
    "aip",
    "tiered-governance",
    "compliance",
    "iso42001",
    "nist-ai-rmf"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "pyyaml>=6.0.1",
    "jsonschema>=4.20.0",
    "typer>=0.18.0",
    "jinja2>=3.1.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
    "dacite>=1.8.0",
    "ruamel.yaml>=0.18.0",
    "llm>=0.19.0",
    # Gated run emission executes lorchestra's object.create in-process
    # (gate_emission.py). Declared so venv rebuilds keep it — an ad-hoc
    # non-editable install broke two runs' emissions on 2026-07-20.
    # Goes away when the job executor lifts out of lorchestra.
    "lorchestra>=0.1.0",
]

[tool.uv.sources]
lorchestra = { path = "/workspace/lorchestra", editable = true }

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-pyyaml>=6.0.12",
]

[project.urls]
Repository = "https://github.com/benthepsychologist/specwright"
Issues = "https://github.com/benthepsychologist/specwright/issues"
Documentation = "https://github.com/benthepsychologist/specwright"
Homepage = "https://github.com/benthepsychologist/specwright"

[project.scripts]
spec = "spec.cli.spec:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spec = [
    "templates/*.md",
    "templates/aips/*.yaml",
    "templates/jobdefs/*.yaml",
    "schemas/*.json"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument - required for Typer CLI option/argument pattern
    "B904",  # raise from - not applicable for typer.Exit() in CLI error handling
    "B905",  # zip strict= - not always needed when iterating known-same-length iterables
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml.*", "typer.*", "jsonschema.*", "autogov", "autogov.*"]
ignore_missing_imports = true
