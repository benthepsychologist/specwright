# aip-1: 3-pass spec execution with drift correction
#
# Execution model:
#   Run 1 (agent.run_spec): Execute the spec
#   Run 2 (agent.drift_fix): Check for drift, plan fixes, execute
#   Run 3 (agent.drift_verify): Final verification pass
#
# Failure handling:
#   - Run 1 fails: skip Runs 2/3 (via on_failure_skip_to)
#   - Run 2 fails: still proceed with Run 3 (continue_on_failure)
#   - Commits after each successful Claude run

job_id: aip-1
version: "0.3"
kind: jobdef
artifact_id: 84deda0d-ff64-5ffc-a5d2-a5dea2c6d7d6
name: aip-1
description: Execute a spec with 3-pass agent verification

steps:
  # Step 1: Create or switch to feature branch - must succeed
  - step_id: branch.create
    backend: cmd
    description: Create or switch to feature branch
    payload:
      command: "git checkout @payload.feature_branch 2>/dev/null || git checkout -b @payload.feature_branch"
      capture_git: true
    continue_on_failure: false

  # Step 2: Sync agent reference files from build.yaml
  - step_id: refs.sync
    backend: python
    description: Sync agent reference files and project skills
    payload:
      callable: "agent.sync_refs"
      agents: ["@payload.agent"]
      project: "@payload.project"
      spec_md: "@payload.spec_md"
      spec_id: "@payload.spec_id"
      skills: "@payload.skills"
    continue_on_failure: true

  # Step 3: Run 1 - Execute spec
  - step_id: agent.run_spec
    backend: "@payload.agent"
    description: "Run 1: Execute spec with agent"
    payload:
      spec_md: "@payload.spec_md"
      repo_path: "@payload.repo_path"
      models: "@payload.models"
      capture_git: true
    timeout_s: 1800
    on_failure_skip_to: capture.bundle
    capture_patch: true

  # Step 4: Commit after Run 1
  - step_id: commit.run1
    backend: cmd
    description: Commit changes from run 1
    payload:
      command: "git add -A && git commit -m 'spec(@payload.spec_id): revision 1' || true"
      capture_git: true
    continue_on_failure: true

  # Step 5: Run 2 - Drift inspection and fix
  - step_id: agent.drift_fix
    backend: "@payload.agent"
    description: "Run 2: Inspect for drift and fix"
    payload:
      prompt_type: drift_fix
      spec_md: "@payload.spec_md"
      epic_spec: "@payload.epic_spec"
      repo_path: "@payload.repo_path"
      models: "@payload.models"
      capture_git: true
    timeout_s: 1800
    continue_on_failure: true
    capture_patch: true

  # Step 6: Commit after Run 2
  - step_id: commit.run2
    backend: cmd
    description: Commit changes from run 2
    payload:
      command: "git add -A && git commit -m 'spec(@payload.spec_id): revision 2 - drift fix' || true"
      capture_git: true
    continue_on_failure: true

  # Step 7: Run 3 - Final drift verification
  - step_id: agent.drift_verify
    backend: "@payload.agent"
    description: "Run 3: Final drift verification"
    payload:
      prompt_type: drift_verify
      spec_md: "@payload.spec_md"
      epic_spec: "@payload.epic_spec"
      repo_path: "@payload.repo_path"
      models: "@payload.models"
      capture_git: true
    timeout_s: 1800
    continue_on_failure: true
    capture_patch: true

  # Step 8: Commit after Run 3
  - step_id: commit.run3
    backend: cmd
    description: Commit changes from run 3
    payload:
      command: "git add -A && git commit -m 'spec(@payload.spec_id): revision 3 - verification' || true"
      capture_git: true
    continue_on_failure: true

  # Step 9: Capture bundle - best effort
  - step_id: capture.bundle
    backend: cmd
    description: Bundle execution artifacts
    payload:
      command: "git log --oneline -10 || git diff --stat"
      capture_git: true
    continue_on_failure: true

  # Step 10: Assess acceptance - best effort
  - step_id: assess.acceptance
    backend: llm
    description: Assess spec acceptance criteria
    payload:
      prompt_type: acceptance_review
      spec_md: "@payload.spec_md"
      epic_spec: "@payload.epic_spec"
      repo_path: "@payload.repo_path"
    continue_on_failure: true

  # Step 11: Finalize run - always try
  - step_id: finalize.run
    backend: cmd
    description: Finalize run and write summary
    payload:
      command: "echo 'Run finalized'"
      capture_git: false
    continue_on_failure: true

  # Step 12: Suggest improvements (LLM analysis of the run)
  - step_id: analyze.suggest_improvements
    backend: llm
    description: Analyze run and suggest improvements
    payload:
      system: |
        You are analyzing a software development run to suggest improvements.
        Generate actionable suggestions across these categories:
        - Agent Instructions (for CLAUDE.md/reference files)
        - Code Improvements (refactoring, enhancements)
        - Build System Updates (invariants, boundaries, rules)
        - Test Coverage Gaps (missing test cases)

        For each suggestion provide:
        1. Confidence (high/medium/low)
        2. Clear description of what to do
        3. Rationale (why it helps)
        4. Related files (if applicable)

        Respond with a markdown report. If the run completed successfully with
        no issues worth flagging, say so briefly and skip the suggestions.
      context: |
        # Run Analysis

        ## Run Info
        Run: @run.run_id | Branch: @run.branch

        ## Step: branch.create
        - Outcome: @run.steps.branch.create.outcome
        - Exit code: @run.steps.branch.create.exit_code

        ## Step: agent.run_spec
        - Outcome: @run.steps.agent.run_spec.outcome
        - Exit code: @run.steps.agent.run_spec.exit_code
        - Stderr:
        ```
        @run.steps.agent.run_spec.stderr
        ```

        ## Step: agent.drift_fix
        - Outcome: @run.steps.agent.drift_fix.outcome
        - Exit code: @run.steps.agent.drift_fix.exit_code

        ## Step: agent.drift_verify
        - Outcome: @run.steps.agent.drift_verify.outcome
        - Exit code: @run.steps.agent.drift_verify.exit_code

        ## Step: assess.acceptance
        - Outcome: @run.steps.assess.acceptance.outcome
        - Stdout (assessment):
        ```
        @run.steps.assess.acceptance.stdout
        ```
      prompt: "Analyze this run and produce a markdown report with categorized improvement suggestions. Include confidence levels (high/medium/low)."
    continue_on_failure: true

  # Step 13: Stage improvement suggestions for human review
  - step_id: stage.improvements
    backend: cmd
    description: Stage improvement suggestions for human review
    payload:
      command: |
        mkdir -p ~/.local/local-governor/improvements/pending
        cat > ~/.local/local-governor/improvements/pending/@payload.spec_id"".md << 'EOF'
        # Improvement Suggestions: @payload.spec_id
        # Run: @run.run_id
        # Branch: @run.branch
        # Status: PENDING REVIEW

        @run.steps.analyze.suggest_improvements.stdout
        EOF
        echo "Staged at: ~/.local/local-governor/improvements/pending/@payload.spec_id"".md"
      capture_git: false
    continue_on_failure: true
