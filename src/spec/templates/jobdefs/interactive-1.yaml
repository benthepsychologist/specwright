# interactive-1: Human-guided spec execution via Claude Code TUI
#
# Execution model:
#   Step 1: Create feature branch
#   Step 2: Sync agent reference files
#   Step 3: Interactive Claude session (human in the loop)
#   Step 4: Commit changes (best effort)
#   Step 5: Capture artifacts (best effort)
#   Step 6: Finalize
#   Step 7: Suggest improvements (LLM analysis of the run)
#
# The interactive step is marked interactive=true, so exit codes
# (130/SIGINT, 143/SIGTERM) are treated as telemetry, not failure.

job_id: interactive-1
version: "0.2"
kind: jobdef
artifact_id: 6b65a22a-eeaa-54ca-af78-4025537820ad
name: interactive-1
description: Human-guided spec execution via Claude Code TUI

steps:
  # Step 1: Create or switch to feature branch - must succeed
  - step_id: branch.create
    backend: cmd
    description: Create or switch to feature branch
    payload:
      command: "git checkout @payload.feature_branch 2>/dev/null || git checkout -b @payload.feature_branch"
      capture_git: true
    continue_on_failure: false

  # Step 2: Sync agent reference files from build.yaml
  - step_id: refs.sync
    backend: python
    description: Sync agent reference files and project skills
    payload:
      callable: "agent.sync_refs"
      agents: ["@payload.agent"]
      project: "@payload.project"
      spec_md: "@payload.spec_md"
      spec_id: "@payload.spec_id"
      skill: "@payload.skill"
      skills: "@payload.skills"
    continue_on_failure: true

  # Step 3: Interactive Claude session
  - step_id: agent.interactive
    backend: "@payload.agent"
    description: Interactive Claude Code session
    payload:
      interactive: true
      spec_md: "@payload.spec_md"
      repo_path: "@payload.repo_path"
      capture_git: true
    interactive: true
    timeout_s: 86400 # 24h - interactive has no real timeout
    on_failure_skip_to: capture.bundle
    capture_patch: true

  # Step 4: Commit changes (best effort)
  - step_id: commit.interactive
    backend: cmd
    description: Commit changes from interactive session
    payload:
      command: "git add -A && git commit -m 'spec(@payload.spec_id): interactive session' || true"
      capture_git: true
    continue_on_failure: true

  # Step 5: Capture bundle (best effort)
  - step_id: capture.bundle
    backend: cmd
    description: Bundle execution artifacts
    payload:
      command: "git log --oneline -10 || git diff --stat"
      capture_git: true
    continue_on_failure: true

  # Step 6: Finalize run (best effort)
  - step_id: finalize.run
    backend: cmd
    description: Finalize run
    payload:
      command: "echo 'Interactive run finalized'"
      capture_git: false
    continue_on_failure: true

  # Step 7: Suggest improvements (LLM analysis of the run)
  - step_id: analyze.suggest_improvements
    backend: llm
    description: Analyze run and suggest improvements
    payload:
      system: |
        You are analyzing a software development run to suggest improvements.
        Generate actionable suggestions across these categories:
        - Agent Instructions (for CLAUDE.md/reference files)
        - Code Improvements (refactoring, enhancements)
        - Build System Updates (invariants, boundaries, rules)
        - Test Coverage Gaps (missing test cases)

        For each suggestion provide:
        1. Confidence (high/medium/low)
        2. Clear description of what to do
        3. Rationale (why it helps)
        4. Related files (if applicable)

        Respond with a markdown report. If the run completed successfully with
        no issues worth flagging, say so briefly and skip the suggestions.
      context: |
        # Run Analysis

        ## Run Info
        Run: @run.run_id | Branch: @run.branch

        ## Step: branch.create
        - Outcome: @run.steps.branch.create.outcome
        - Exit code: @run.steps.branch.create.exit_code

        ## Step: agent.interactive
        - Outcome: @run.steps.agent.interactive.outcome
        - Exit code: @run.steps.agent.interactive.exit_code
        - Stderr:
        ```
        @run.steps.agent.interactive.stderr
        ```
        - Stdout (agent transcript):
        ```
        @run.steps.agent.interactive.stdout
        ```

        ## Step: commit.interactive
        - Outcome: @run.steps.commit.interactive.outcome

        ## Step: capture.bundle
        - Outcome: @run.steps.capture.bundle.outcome
        - Stdout:
        ```
        @run.steps.capture.bundle.stdout
        ```
      prompt: "Analyze this run and produce a markdown report with categorized improvement suggestions. Include confidence levels (high/medium/low)."
    continue_on_failure: true
