# interactive-1: Human-guided spec execution via Claude Code TUI
#
# Execution model:
#   Step 1: Create feature branch
#   Step 2: Interactive Claude session (human in the loop)
#   Step 3: Commit changes (best effort)
#   Step 4: Capture artifacts (best effort)
#   Step 5: Finalize
#
# The interactive step is marked interactive=true, so exit codes
# (130/SIGINT, 143/SIGTERM) are treated as telemetry, not failure.

job_id: interactive-1
version: "0.1"
description: Human-guided spec execution via Claude Code TUI

steps:
  # Step 1: Create or switch to feature branch - must succeed
  - step_id: branch.create
    backend: cmd
    description: Create or switch to feature branch
    payload:
      command: "git checkout @payload.feature_branch 2>/dev/null || git checkout -b @payload.feature_branch"
      capture_git: true
    continue_on_failure: false

  # Step 2: Interactive Claude session
  - step_id: agent.interactive
    backend: claude-code
    description: Interactive Claude Code session
    payload:
      interactive: true
      spec_md: "@payload.spec_md"
      repo_path: "@payload.repo_path"
      capture_git: true
    interactive: true
    timeout_s: 86400  # 24h - interactive has no real timeout
    on_failure_skip_to: capture.bundle
    capture_patch: true

  # Step 3: Commit changes (best effort)
  - step_id: commit.interactive
    backend: cmd
    description: Commit changes from interactive session
    payload:
      command: "git add -A && git commit -m 'spec: interactive session' || true"
      capture_git: true
    continue_on_failure: true

  # Step 4: Capture bundle (best effort)
  - step_id: capture.bundle
    backend: cmd
    description: Bundle execution artifacts
    payload:
      command: "git log --oneline -10 || git diff --stat"
      capture_git: true
    continue_on_failure: true

  # Step 5: Finalize run (best effort)
  - step_id: finalize.run
    backend: cmd
    description: Finalize run
    payload:
      command: "echo 'Interactive run finalized'"
      capture_git: false
    continue_on_failure: true
