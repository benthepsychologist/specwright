# Sample ArchPack fixture for testing
name: specwright-arch
version: "2.0.0"

decisions:
  - id: ADR-001
    title: "Use Typer for CLI framework"
    status: accepted
    summary: "Typer provides type-safe CLI argument parsing with minimal boilerplate"
    context: "Need a CLI framework that integrates well with Python type hints"
    decision: "Adopt Typer as the primary CLI framework"

  - id: ADR-002
    title: "YAML for configuration files"
    status: accepted
    summary: "YAML is more human-readable than JSON for configuration"
    context: "Configuration files need to be easily editable by users"
    decision: "Use YAML format for all configuration files"

  - id: ADR-003
    title: "Jinja2 for template rendering"
    status: accepted
    summary: "Jinja2 provides powerful templating with good Python integration"
    context: "Need to generate specs and AIPs from templates"
    decision: "Use Jinja2 for all template rendering"
